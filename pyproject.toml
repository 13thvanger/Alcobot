[project]
name = "alcobot"
version = "0.1.0"
description = "Telegram bot for tracking consumed pure alcohol"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.setuptools.package-data]
app = ["phrases.txt"]
